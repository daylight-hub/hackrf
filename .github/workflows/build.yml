name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  ZADIG_FALLBACK_URL: https://github.com/pbatard/libwdi/releases/download/v1.5.1/zadig-2.9.exe

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: System libraries (Qt offscreen + HackRF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 hackrf libhackrf0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi
      - name: Lint
        run: ruff check src tests tools
      - name: Unit tests
        run: pytest
      - name: Check your scripts parse
        run: |
          shopt -s nullglob
          for f in scripts/*.py examples/*.py; do python -m rfstudio --list-options "$f"; done
      - name: GUI smoke test + screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/screenshot.py screenshots --run
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  build-linux:
    name: Linux build
    needs: test
    # Oldest supported runner = widest glibc compatibility for the binaries.
    # ubuntu-22.04 is being retired by GitHub (April 2027); switch to ubuntu-24.04 then.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
            sed -i "s/^__version__ = .*/__version__ = \"$V\"/" src/rfstudio/__init__.py
          else V="$(python -c 'import re;print(re.search(r"__version__ = \"(.+)\"", open("src/rfstudio/__init__.py").read())[1])')"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hackrf libhackrf0 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 dpkg-dev
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi
      - name: PyInstaller
        run: pyinstaller packaging/rfstudio.spec --noconfirm
      - name: Smoke test (real libhackrf + simulated HackRF)
        run: |
          mkdir -p /tmp/mockhrf
          cc -shared -fPIC -pthread -O2 -o /tmp/mockhrf/libhackrf.so.0 tests/mock/mock_libhackrf.c
          python tools/smoke_test.py dist/RFScriptStudio --expect-hackrf --mock-lib=/tmp/mockhrf
      - name: Package (.tar.gz + .deb)
        run: bash tools/package_linux.sh "${{ steps.ver.outputs.version }}"
      - name: Test .deb install
        run: |
          sudo apt-get install -y ./dist/rf-script-studio_${{ steps.ver.outputs.version }}_amd64.deb
          /opt/rf-script-studio/rfstudio-cli --version
      - uses: actions/upload-artifact@v4
        with:
          name: RFScriptStudio-linux
          path: |
            dist/*.tar.gz
            dist/*.deb

  build-windows:
    name: Windows build
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
            sed -i "s/^__version__ = .*/__version__ = \"$V\"/" src/rfstudio/__init__.py
          else V="$(python -c 'import re;print(re.search(r"__version__ = \"(.+)\"", open("src/rfstudio/__init__.py").read())[1])')"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: HackRF for Windows (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: hackrf
          create-args: hackrf
          condarc: |
            channels:
              - conda-forge
          init-shell: none
          cache-environment: true
      - name: Collect HackRF DLLs and tools
        run: python tools/collect_hackrf_windows.py "$MAMBA_ROOT_PREFIX/envs/hackrf" vendor/hackrf/windows
      - name: Bundle Zadig (WinUSB driver installer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vendor/drivers/windows
          cd vendor/drivers/windows
          gh release download --repo pbatard/libwdi --pattern 'zadig-*.exe' --clobber \
            || curl -fsSL -o zadig-fallback.exe "$ZADIG_FALLBACK_URL" \
            || echo "::warning::Could not download Zadig; the build will not include it"
          f=$(ls zadig*.exe 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then mv "$f" zadig.exe; cp ../../../packaging/windows/zadig.ini .; ls -la; fi
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi
      - name: PyInstaller
        run: pyinstaller packaging/rfstudio.spec --noconfirm
      - name: Smoke test
        run: python tools/smoke_test.py dist/RFScriptStudio --expect-hackrf
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/RFScriptStudio -DestinationPath "dist/RFScriptStudio-${{ steps.ver.outputs.version }}-windows-x64.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: RFScriptStudio-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
