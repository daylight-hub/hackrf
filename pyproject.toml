[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-script-studio"
dynamic = ["version"]
description = "Desktop control centre for HackRF Python scripts: auto-generated options, supervision, tray + background service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "pyhackrf2>=1.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "pyinstaller>=6.6"]

[project.scripts]
rfstudio-cli = "rfstudio.cli:main"

[project.gui-scripts]
rfstudio = "rfstudio.cli:main"

[tool.setuptools.dynamic]
version = { attr = "rfstudio.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
