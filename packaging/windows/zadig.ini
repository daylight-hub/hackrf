; Zadig configuration used by RF Script Studio
; Preselects WinUSB (the driver libhackrf uses) and lists all USB devices so the
; HackRF shows up even if Windows already bound another driver to it.
[general]
  advanced_mode = false
  exit_on_success = true
  log_level = 0

[device]
  list_all = true
  include_hubs = false
  trim_whitespaces = true

[driver]
  ; 0 = WinUSB, 1 = libusb-win32, 2 = libusbK
  default_driver = 0
  extract_only = false

[security]
  disable_cert_install_warning = false
